title: "How Do Nonprofits Use Cash Windfalls? Evidence from $5B in Unrestricted Donations"
authors:
badge: "Updated"
badge_date: "July 2026"
abstract: "I use $5B of MacKenzie Scott's unrestricted gifts as a natural experiment to test the hypothesis of a “nonprofit starvation cycle” caused by donation use-restrictions. Comparing 643 recipients to similar nonrecipients with difference-in-differences, I find that recipients attracted additional donations, spent the entire gift within two years, and disbursed 20% of new spending as grants to others and 3% as executive compensation. In present value, $0.18 per dollar of the windfall was spent on executive pay. With a corporate-finance model of nonprofits maximizing charitable output subject to donation use-restrictions, the evidence casts doubt on the starvation cycle hypothesis."
link: "/assets/nonprofit_windfalls.pdf"
