    <!-- Layout tweaks: section rules and a sticky left photo column (stacks on mobile) -->
    <style>
      :root {
        --accent-light: #4a6fc0; /* lighter shade of the theme navy, for rules */
        --global-text-color: #363636;
        --heading-color: #222;
      }

      /* Wider page so the sidebar doesn't squeeze the text column */
      .container { max-width: 1040px; }

      /* Typography: Noto Sans, 14px, dark gray text; navy only for accents */
      body {
        font-family: "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--global-text-color);
      }

      /* [SSRN] links: theme navy instead of main.css's plain blue */
      .post article a.paper-link { color: var(--global-theme-color); }

      /* Abstract toggle: small gray text with a boxed +, which becomes – when open */
      .post article a.abstract-toggle {
        font-size: 0.9em;
        color: #6b6b6b;
        text-decoration: none;
        cursor: pointer;
        gap: 0.4em;
      }

      .post article a.abstract-toggle:hover { color: var(--global-theme-color); }

      .post article a.abstract-toggle::before {
        content: '+';
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.05em;
        height: 1.05em;
        border: 1px solid currentColor;
        border-radius: 3px;
        font-weight: 700;
        line-height: 1;
      }

      .post article a.abstract-toggle:not(.collapsed)::before { content: '\2013'; }

      /* Abstract text: same gray, italic */
      .post article .abstract-text,
      .post article .abstract-text p {
        color: #6b6b6b;
        font-style: italic;
      }

      /* Journal citations in navy */
      .post article .paper-journal,
      .post article .paper-journal em { color: var(--global-theme-color); }

      .post article strong,
      .post article b { color: var(--heading-color); font-weight: 700; }

      /* Paper titles: bold dark gray instead of blue; navy on hover */
      .post article a.paper-title,
      .post article a.paper-title:visited {
        color: var(--heading-color);
        font-weight: 700;
      }

      .post article a.paper-title:hover {
        color: var(--global-theme-color);
        text-decoration: none;
      }

      /* Section headers with a navy rule underneath */
      .post article h2 {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--heading-color);
        border-bottom: 2px solid var(--accent-light);
        padding-bottom: 8px;
        margin-top: 2rem;
        margin-bottom: 1rem;
      }

      /* Grid: name above the content column, photo to its left,
         photo top lines up with the first paragraph */
      .post article {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        grid-template-areas:
          ".     name"
          "photo content";
        column-gap: 2.5rem;
        align-items: start;
      }

      .site-name { grid-area: name; }
      .post article > .profile { grid-area: photo; }
      .post article > .clearfix { grid-area: content; }

      /* Name: a step larger than the section headers, no rule */
      .post article .site-name {
        font-size: 1.3rem;
        font-weight: 700;
        line-height: 1.2;
        text-align: left;
        color: var(--heading-color);
        margin: 0 0 1rem;
      }

      /* Photo column stays in view while scrolling */
      .profile.float-left {
        float: none !important;
        width: auto;
        margin: 0;
        position: sticky;
        top: 5rem;
      }

      .profile figure { margin: 0; }

      /* Top bar has no links now, so hide the empty mobile menu button */
      #navbar .navbar-toggler { display: none; }

      /* Pin the top bar to the 56px the page reserves for it, so the
         progress-bar script's padding reset after load doesn't shift the page */
      #navbar { min-height: 56px; }

      /* Email and CV under the photo */
      .profile-info {
        margin-top: 0.75rem;
        font-size: 0.9rem;
      }

      .profile-info div { color: var(--global-text-color); }

      .profile img {
        width: 100%;
        height: auto;
        aspect-ratio: 220 / 270;
        object-fit: cover;
        object-position: 43% top;
      }

      /* Medium windows: keep the sidebar, but slimmer */
      @media (max-width: 991.98px) {
        .post article {
          grid-template-columns: 180px minmax(0, 1fr);
          column-gap: 1.5rem;
        }

        .profile-info { font-size: 0.8rem; }
      }

      /* Small screens: photo centered, then the name, then the text */
      @media (max-width: 639.98px) {
        .post article {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            "photo"
            "name"
            "content";
        }

        .profile.float-left {
          position: static;
          width: 220px;
          margin: 0 auto 1.5rem;
        }

        .profile-info { text-align: center; }
      }
    </style>

    <!-- The progress bar script can stay deferred,
         but if toggles still fail, remove 'defer' from it too. -->
    <script type="text/javascript">
      function progressBarSetup(){
        if("max" in document.createElement("progress")){
          initializeProgressElement();
          $(document).on("scroll",function(){
            progressBar.attr({ value: getCurrentScrollPosition() });
          });
          $(window).on("resize",initializeProgressElement);
        } else {
          resizeProgressBar();
          $(document).on("scroll",resizeProgressBar);
          $(window).on("resize",resizeProgressBar);
        }
      }

      function getCurrentScrollPosition(){
        return $(window).scrollTop();
      }

      function initializeProgressElement(){
        let e = $("#navbar").outerHeight(true);
        $("body").css({ "padding-top": e });
        $("progress-container").css({ "padding-top": e });
        progressBar.css({ top: e });
        progressBar.attr({
          max: getDistanceToScroll(),
          value: getCurrentScrollPosition()
        });
      }

      function getDistanceToScroll(){
        return $(document).height() - $(window).height();
      }

      function resizeProgressBar(){
        progressBar.css({
          width: getWidthPercentage() + "%"
        });
      }

      function getWidthPercentage(){
        return getCurrentScrollPosition()/getDistanceToScroll()*100;
      }

      const progressBar = $("#progress");
      window.onload = function(){
        setTimeout(progressBarSetup,50);
      };
    </script>
